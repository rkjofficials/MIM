<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1217"/>
      <stop offset="100%" stop-color="#050709"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bg)"/>
  
  <!-- Central Safe Zone content (80% box in center) -->
  <circle cx="256" cy="256" r="120" fill="url(#glow)"/>

  <g transform="translate(136, 136) scale(0.85)">
    <!-- Top Server Blade -->
    <rect x="0" y="20" width="280" height="60" rx="12" fill="#161b22" stroke="#30363d" stroke-width="3"/>
    <circle cx="36" cy="50" r="7" fill="#38bdf8"/>
    <circle cx="60" cy="50" r="7" fill="#10b981"/>
    <line x1="100" y1="50" x2="244" y2="50" stroke="#30363d" stroke-width="6" stroke-linecap="round"/>

    <!-- Mid Server Blade (Active) -->
    <rect x="0" y="110" width="280" height="60" rx="12" fill="#161b22" stroke="url(#accent)" stroke-width="3.5"/>
    <circle cx="36" cy="140" r="7" fill="#6366f1"/>
    <circle cx="60" cy="140" r="7" fill="#38bdf8"/>
    <line x1="100" y1="140" x2="210" y2="140" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="244" cy="140" r="5" fill="#10b981"/>

    <!-- Bottom Server Blade -->
    <rect x="0" y="200" width="280" height="60" rx="12" fill="#161b22" stroke="#30363d" stroke-width="3"/>
    <circle cx="36" cy="230" r="7" fill="#8b5cf6"/>
    <circle cx="60" cy="230" r="7" fill="#38bdf8"/>
    <line x1="100" y1="230" x2="230" y2="230" stroke="#30363d" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>